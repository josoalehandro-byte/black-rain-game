name: Build BLACK RAIN GAME APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project archive
        run: unzip -o BLACK_RAIN_GAME_GITHUB_READY.zip -d build-source

      - name: Build debug APK
        working-directory: build-source/Black_Rain_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-RAIN-GAME-APK
          path: build-source/Black_Rain_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
