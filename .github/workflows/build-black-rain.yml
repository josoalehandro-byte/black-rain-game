name: Build BLACK RAIN GAME Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project archive
        run: |
          unzip -o BLACK_RAIN_GAME_GITHUB_READY.zip -d build-source
          test -f build-source/Black_Rain_Android_Project/app/build.gradle.kts

      - name: Create temporary signing key
        working-directory: build-source/Black_Rain_Android_Project
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass temporary-build-password \
            -keypass temporary-build-password \
            -alias blackrain \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BLACK RAIN GAME, OU=Android, O=BLACK RAIN, L=Kyiv, ST=Kyiv, C=UA"

      - name: Configure signed Release build
        working-directory: build-source/Black_Rain_Android_Project
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "temporary-build-password"
                      keyAlias = "blackrain"
                      keyPassword = "temporary-build-password"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isDebuggable = false
                  }
              }
          }
          EOF

      - name: Build signed Release APK
        working-directory: build-source/Black_Rain_Android_Project
        run: gradle --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-RAIN-GAME-RELEASE-APK
          path: build-source/Black_Rain_Android_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
